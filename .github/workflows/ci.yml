# Foundation 001 §10 — continuous integration on every push and pull request.
# CI holds no secret. The service container is the only database it touches.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, boundary, build, test, audit, secret patterns
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci --ignore-scripts
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Boundary check (§4.3)
        run: npm run boundary:check
      - name: Build
        run: npm run build
      - name: Test (unit, contract, boundary)
        run: npm test
      - name: Dependency audit (§10 step 6, SEC-PLAT-04)
        run: npm audit --audit-level=high
      - name: No platform-injected database variable (A08)
        run: scripts/check-db-env-names.sh
      - name: No secret pattern in the diff (§10 step 7)
        run: scripts/check-secret-patterns.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  database:
    name: provisioning dry run, migrations, and database-backed tests (§6.5, §10 steps 3–5)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci --ignore-scripts
      - name: Start PostgreSQL 18 with TLS (per-run CA)
        run: scripts/ci/start-postgres-tls.sh "$RUNNER_TEMP/pg-tls" 18
      - name: Provision both databases, four roles, and a CI marker (A27)
        run: |
          chmod +x scripts/provision/provision.sh
          scripts/ci/provision-and-export.sh \
            --admin-url postgresql://postgres:postgres@localhost:5432/postgres \
            --ca-file "$RUNNER_TEMP/pg-tls/ca.crt"
      - name: Verify the CI marker and role attributes (read-only)
        run: |
          psql "${PM_CI_ADMIN_URL%/postgres}/provider_mesh" -Atc \
            "SELECT environment FROM mesh_instance" | grep -qx ci
          psql "${PM_CI_ADMIN_URL%/postgres}/provider_mesh" -Atc \
            "SELECT count(*) FROM pg_roles WHERE rolname IN ('mesh_migrate','mesh_app','mesh_audit_writer','mesh_audit_reader') AND NOT rolbypassrls AND NOT rolsuper" | grep -qx 4
      - name: Rehearse the pending migrations in a rollback transaction (§5.4, A04)
        run: npm run db:rehearse
      - name: Apply the migrations as mesh_migrate (§5.4, §10 step 4)
        run: npm run db:migrate
      - name: Ledger at head, zero pending, zero hash mismatches (A05)
        run: npm run db:status
      - name: Verify ledger hashes, catalog state, grants, roles, reference rows (A06)
        run: npm run db:verify
      - name: Database-backed tests as the application roles (§10 step 5)
        run: npm run test:db
      - name: Verify the audit chain as mesh_audit_reader (§5.5 rule 3, A14)
        run: npm run audit:verify
      - name: Export a checkpoint through the object-store port, then verify the chain against it (§5.5 rule 4, A15)
        run: |
          npm run audit:checkpoint -- --identity ci:checkpoint
          npm run audit:verify
